# Model Configuration Schema & Defaults (Phase 0 Scaffold)
experiment:
  name: "delhi_aqi_attribution"
  random_state: 42

target:
  name: "PM2.5"
  unit: "µg/m³"

features:
  environmental:
    - temperature
    - humidity
    - wind_speed
    - wind_direction
    - atmospheric_pressure
  emission_proxies:
    - vehicular_density_index
    - industrial_emission_index
    - stubble_burning_fire_counts
    - construction_activity_index
  regional:
    - boundary_layer_height
    - ventilation_coefficient

hyperparameters:
  xgboost:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 6
  lightgbm:
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 31
